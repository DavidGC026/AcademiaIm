services:
  db:
    image: mysql:8.0
    container_name: imcyc-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: academia_imcyc
      MYSQL_USER: imcyc_user
      MYSQL_PASSWORD: imcyc_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: imcyc-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
